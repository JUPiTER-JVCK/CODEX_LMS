name: Publish release files
# Builds the universal Mac app, the single file CODEX_LMS.html (page + terminal app + Mac app + Python) and a
# ready-to-use CODEX_LMS-all.zip (app, html, double-click launcher) and attaches them to a GitHub Release.
# Runs when a release is published, or by hand (Actions > Publish release files > Run workflow) for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the app to (for example v1.1.0)
        required: true
permissions:
  contents: write
jobs:
  mac-app:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen
      # Ad-hoc signed ("-"), not notarized: first launch needs Open Anyway (see README).
      - name: Build Mac app (Release, Apple Silicon and Intel)
        run: |
          xcodebuild -project apple/CODEX_LMS.xcodeproj -scheme CODEX_LMS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
            build
          APP=build/Build/Products/Release/CODEX_LMS.app
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/CODEX_LMS"
          test -f "$APP/Contents/Resources/dist/index.html"
          mkdir -p out && ditto -c -k --keepParent "$APP" out/CODEX_LMS-mac.zip
          shasum -a 256 out/CODEX_LMS-mac.zip | tee out/CODEX_LMS-mac.zip.sha256
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build the single file and the all-in-one package
        run: |
          npm ci
          npm run tui:build
          python3 tools/bundle.py --app out/CODEX_LMS-mac.zip --out out/CODEX_LMS.html
          rm -rf pkg && mkdir -p pkg/CODEX_LMS
          ditto -x -k out/CODEX_LMS-mac.zip pkg/CODEX_LMS
          cp out/CODEX_LMS.html pkg/CODEX_LMS/
          cp "tools/package/Start CODEX_LMS.command" tools/package/README.txt pkg/CODEX_LMS/
          chmod +x "pkg/CODEX_LMS/Start CODEX_LMS.command"
          (cd pkg && ditto -c -k --keepParent CODEX_LMS ../out/CODEX_LMS-all.zip)
          cp apps/tui/dist/codex-tui.mjs out/
          (cd out && shasum -a 256 CODEX_LMS-all.zip CODEX_LMS.html codex-tui.mjs > SHA256SUMS.txt)
          ls -la out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/CODEX_LMS-all.zip out/CODEX_LMS.html out/CODEX_LMS-mac.zip out/codex-tui.mjs out/SHA256SUMS.txt out/CODEX_LMS-mac.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
