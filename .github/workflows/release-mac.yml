name: Publish Mac app
# Builds the universal Mac app and attaches CODEX_LMS-mac.zip to a GitHub Release.
# Runs when a release is published, or by hand (Actions > Publish Mac app > Run workflow) for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the app to (for example v1.1.0)
        required: true
permissions:
  contents: write
jobs:
  mac-app:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen
      # Ad-hoc signed ("-"), not notarized: first launch needs Open Anyway (see README).
      - name: Build Mac app (Release, Apple Silicon and Intel)
        run: |
          xcodebuild -project apple/CODEX_LMS.xcodeproj -scheme CODEX_LMS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
            build
          APP=build/Build/Products/Release/CODEX_LMS.app
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/CODEX_LMS"
          test -f "$APP/Contents/Resources/dist/index.html"
          mkdir -p out && ditto -c -k --keepParent "$APP" out/CODEX_LMS-mac.zip
          shasum -a 256 out/CODEX_LMS-mac.zip | tee out/CODEX_LMS-mac.zip.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/CODEX_LMS-mac.zip out/CODEX_LMS-mac.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
