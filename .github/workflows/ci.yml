name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  classic-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Build
        run: |
          python tools/chapters.py
          python tools/build.py
          python tools/export_outline.py
      - name: dist and content are up to date
        run: git diff --exit-code -- dist/index.html content
      - name: Test
        run: |
          (cd dist && python -m http.server 8765 &)
          sleep 2
          python test/blocks.py servers apis crypto cloud
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Widget engine tests
        run: npm test
      - name: TUI type-check
        run: npx tsc --noEmit -p apps/tui
      - name: GUI type-check and build
        run: npm run gui:build
