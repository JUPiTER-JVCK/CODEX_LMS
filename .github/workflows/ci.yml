name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  classic-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Labs are placed in their chapters
        run: python tools/add_labs.py --check
      - name: Reference figures are placed in their chapters
        run: python tools/add_figures.py --check
      - name: Build
        run: |
          python tools/chapters.py
          python tools/build.py
      - name: dist is up to date
        run: git diff --exit-code -- dist/index.html dist/toc.json
      - name: ASCII diagrams are aligned
        run: python tools/lint_ascii.py --quiet
      - name: Display filters match tshark
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          python test/pcapfilters.py
          python test/wsref_filters.py
      - name: Browser tests
        run: |
          (cd dist && python -m http.server 8765 &)
          sleep 2
          python test/blocks.py servers apis crypto cloud wireshark defend wireshark-ref
          python test/labs.py
          python test/ascii.py
          python test/theme.py
          python test/offline.py
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lab logic tests
        run: npm test
      - name: Type-check the lab views
        run: npx tsc --noEmit -p packages/labs
      - name: src/ws-labs.js is up to date
        run: |
          npm run labs
          git diff --exit-code -- src/ws-labs.js

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Type-check the terminal app
        run: npx tsc --noEmit -p apps/tui
      - name: Unit and headless tests
        run: npm test -w @codex/tui
      - name: Bundle into one file
        run: npm run tui:build
      # Runs the real program in a pseudo-terminal and reads the screen back: keys, mouse, resize, restore on exit.
      - name: End to end, from source and from the bundle
        run: |
          python -m pip install pyte
          python apps/tui/test/e2e_pty.py
          python apps/tui/test/e2e_pty.py apps/tui/dist/codex-tui.mjs
      - name: Upload the bundle
        uses: actions/upload-artifact@v6
        with:
          name: codex-tui
          path: apps/tui/dist/codex-tui.mjs
          if-no-files-found: error
          retention-days: 30

  apple-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: CodexCore tests
        run: swift test --package-path apple
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen
      # Release build for Apple Silicon and Intel, ad-hoc signed ("-") because Apple Silicon
      # will not launch unsigned code. Not notarized: first launch needs Open Anyway.
      - name: Build Mac app (Release)
        run: |
          xcodebuild -project apple/CODEX_LMS.xcodeproj -scheme CODEX_LMS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
            build
          APP=build/Build/Products/Release/CODEX_LMS.app
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/CODEX_LMS"
          test -f "$APP/Contents/Resources/dist/index.html"
          test -f "$APP/Contents/Resources/dist/py/pyodide.asm.wasm"
          mkdir -p out && ditto -c -k --keepParent "$APP" out/CODEX_LMS-mac.zip
      - name: Upload Mac app
        uses: actions/upload-artifact@v6
        with:
          name: CODEX_LMS-mac
          path: out/CODEX_LMS-mac.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build for iOS Simulator
        run: xcodebuild -project apple/CODEX_LMS.xcodeproj -scheme CODEX_LMS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  bundle:
    needs: [tui, apple-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.63.0 pyte && python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: codex-tui
          path: apps/tui/dist
      - uses: actions/download-artifact@v7
        with:
          name: CODEX_LMS-mac
          path: mac
      - name: Assemble CODEX_LMS.html (page + terminal app + Mac app + Python)
        run: python tools/bundle.py --app mac/CODEX_LMS-mac.zip --out CODEX_LMS.html
      - name: Test it as a page and under node
        run: python test/bundle.py CODEX_LMS.html
      - uses: actions/upload-artifact@v6
        with:
          name: CODEX_LMS-single-file
          path: CODEX_LMS.html
          if-no-files-found: error
          retention-days: 30
