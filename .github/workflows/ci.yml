name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  classic-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Build
        run: |
          python tools/chapters.py
          python tools/build.py
      - name: dist is up to date
        run: git diff --exit-code -- dist/index.html
      - name: ASCII diagrams are aligned
        run: python tools/lint_ascii.py --quiet
      - name: Browser tests
        run: |
          (cd dist && python -m http.server 8765 &)
          sleep 2
          python test/blocks.py servers apis crypto cloud
          python test/ascii.py
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Widget logic tests
        run: npm test
