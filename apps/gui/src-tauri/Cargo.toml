[package]
name = "codex"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Add later for upgrades over time:
#   tauri-plugin-updater = "2"   (needs a signing key + update manifest URL in tauri.conf.json)
