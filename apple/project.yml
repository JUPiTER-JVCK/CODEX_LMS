# XcodeGen spec for the CODEX_LMS Apple app (macOS + iPadOS/iOS).
#   brew install xcodegen
#   cd apple && xcodegen && open CODEX_LMS.xcodeproj
# The app bundles ../dist (the built book and the Python runtime), so run tools/build.py first.
name: CODEX_LMS
options:
  bundleIdPrefix: io.github.codexlms
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  CodexCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CODEX_LMS:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # Folder reference: copied into the bundle as "dist/" exactly as built.
      - path: ../dist
        type: folder
        buildPhase: resources
    dependencies:
      - package: CodexCore
        product: CodexCore
    settings:
      base:
        PRODUCT_NAME: CODEX_LMS
        PRODUCT_BUNDLE_IDENTIFIER: io.github.codexlms.reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CODEX_LMS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
